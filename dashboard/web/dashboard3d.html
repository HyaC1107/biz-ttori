<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>또리 주식회사 — 3D 관제 (목업 v2)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #0f1220; font-family: "Pretendard", monospace; color: #e8eaf6; }
  #scene { position: fixed; inset: 0; }
  .hud {
    position: fixed; background: rgba(24,28,48,.88); border: 1px solid #2c3358;
    border-radius: 10px; padding: 12px; backdrop-filter: blur(4px); font-size: 12px;
  }
  #title { top: 14px; left: 14px; }
  #title h1 { font-size: 15px; } #title .lv { color: #ffd166; font-size: 11px; }
  #title .hint { color: #8a91b4; font-size: 10px; margin-top: 4px; }
  #feedbox { right: 14px; top: 14px; width: 280px; }
  #feedbox h2, #apprbox h2 { font-size: 11px; color: #8a91b4; letter-spacing: 2px; margin-bottom: 8px; }
  #feed { list-style: none; max-height: 200px; overflow-y: auto; }
  #feed li { font-size: 10px; padding: 4px 2px; border-bottom: 1px dashed #2c3358; }
  #feed li .ts { color: #8a91b4; margin-right: 6px; font-size: 9px; }
  #feed li.new { background: #232a4d; }
  #apprbox { right: 14px; bottom: 14px; width: 280px; }
  .appr { background: #1f2440; border: 1px solid #2c3358; border-radius: 8px; padding: 8px; margin-bottom: 6px; }
  .appr .t { font-size: 11px; margin-bottom: 6px; }
  .appr button { padding: 4px 10px; font-size: 10px; border: none; border-radius: 5px; cursor: pointer; margin-right: 5px; font-family: inherit; }
  .ok { background: #6ee7a0; } .no { background: #ff8fa3; }
  .appr.done { opacity: .45; } .appr.done button { display: none; }
  .appr .vd { font-size: 10px; color: #ffd166; }
  #cost { bottom: 14px; left: 14px; color: #ffd166; }
  #debatebox { left: 14px; bottom: 64px; width: 300px; display: none; }
  #debatebox h2 { font-size: 11px; color: #8a91b4; letter-spacing: 2px; margin-bottom: 6px; }
  /* 봇 체력 패널 — /api/health 실측만. 없는 데이터는 '측정 불가' */
  #hpbox { right: 14px; top: 300px; width: 280px; }
  #hpbox h2 { font-size: 11px; color: #8a91b4; letter-spacing: 2px; margin-bottom: 8px; }
  #hps3d { list-style: none; margin: 0; padding: 0; }
  #hps3d li { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  #hps3d .hn3 { display: block; font-size: 11.5px; font-weight: 700; color: #d8dcf0; margin-bottom: 3px; }
  #hps3d .ht3 { display: flex; align-items: center; gap: 6px; }
  #hps3d .hbar3 { flex: 1; height: 7px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; }
  #hps3d .hbar3 i { display: block; height: 100%; border-radius: 4px; transition: width .4s; }
  #hps3d b { font-size: 11px; font-variant-numeric: tabular-nums; min-width: 32px; text-align: right; }
  #hps3d em { display: block; font-style: normal; font-size: 9px; color: #8a91b4; margin-top: 2px; }
  #hps3d .hna3 { font-size: 10px; color: #8a91b4; }

  /* 태스크 패널 — 상태는 서버(/api/tasks) 집계, 여기선 렌더만 */
  #taskbox { left: 14px; top: 96px; width: 288px; max-height: 40vh; overflow-y: auto; }
  #taskbox h2 { font-size: 11px; color: #8a91b4; letter-spacing: 2px; margin-bottom: 8px; }
  #tasks { list-style: none; margin: 0; padding: 0; }
  #tasks li { display: flex; gap: 6px; align-items: flex-start; padding: 5px 0;
              border-bottom: 1px solid rgba(255,255,255,.06); font-size: 11px; line-height: 1.35; }
  #tasks li.stuck { border-left: 2px solid #ff8a3d; padding-left: 5px; }
  #tasks .tid { font-family: 'Courier New', monospace; font-size: 10px; color: #8a91b4; flex: 0 0 auto; }
  #tasks .tt { flex: 1; color: #d8dcf0; }
  #tasks .tw { font-size: 9.5px; color: #ff8a3d; }
  #debate-topic { font-size: 11px; color: #ffd166; margin-bottom: 6px; }
  #debate-log { list-style: none; font-size: 10px; line-height: 1.6; color: #c8cde8; }
  #debate-log li { border-bottom: 1px dashed #2c3358; padding: 3px 0; }
</style>
</head>
<body>
<div id="scene"></div>

<div class="hud" id="title">
  <h1>🏢 또리 주식회사 <span class="lv" id="mode">3D — DEMO</span> <a href="board.html" style="font-size:11px;color:#7cc4ff;text-decoration:none">📊 현황판 →</a></h1>
  <div class="hint">드래그 = 회전 · 휠 = 줌 · LIVE는 ttori 루트에서 <code>python3 -m http.server 8787</code> 후 접속</div>
  <div style="margin-top:7px">
    <label for="projsel" style="font-size:10px;color:#8a91b4;letter-spacing:1px">PROJECT</label>
    <select id="projsel" style="background:#1f2440;color:#e8eaf6;border:1px solid #2c3358;border-radius:6px;
        font-size:11px;padding:3px 6px;font-family:inherit;max-width:200px">
      <option value="all">전체</option>
    </select>
  </div>
</div>
<div class="hud" id="feedbox"><h2>📡 실시간 피드</h2><ul id="feed"></ul></div>
<div class="hud" id="apprbox">
  <h2>📋 결재함</h2>
  <div id="apprs">
  <div class="appr"><div class="t">Phase B 설계안 승인</div><button class="ok">✅ 승인</button><button class="no">↩ 반려</button><span class="vd"></span></div>
  <div class="appr"><div class="t">Phase B 첫 스프린트 착수</div><button class="ok">✅ 승인</button><button class="no">↩ 반려</button><span class="vd"></span></div>
  </div>
</div>
<div class="hud" id="debatebox">
  <h2>🏛️ 회의실 — DEBATE</h2>
  <div id="debate-topic"></div>
  <ul id="debate-log"></ul>
</div>
<div class="hud" id="taskbox">
  <h2>🗂️ 태스크 <span id="task-sum" style="font-size:10px;color:#8a91b4;font-weight:400"></span></h2>
  <ul id="tasks"></ul>
</div>
<div class="hud" id="hpbox">
  <h2>🔋 봇 체력 — 구독 한도</h2>
  <ul id="hps3d"></ul>
</div>
<div class="hud" id="cost">🪙 오늘 토큰 <b id="c">—</b> <span id="c2" style="color:#8a91b4"></span></div>

<script src="company-common.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ── 씬 기본 ──────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1220);
scene.fog = new THREE.Fog(0x0f1220, 30, 70);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, .1, 200);
camera.position.set(16, 16, 16);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.getElementById("scene").appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0); controls.maxPolarAngle = Math.PI/2.2;
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xcdd2e8, .85));   // 흰 벽이 살도록 앰비언트 상향
const sun = new THREE.DirectionalLight(0xfff2cc, 1.0);
sun.position.set(10, 18, 8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -20;
sun.shadow.camera.right = sun.shadow.camera.top = 20;
scene.add(sun);

// ── 사무실 건물: 흰 바닥 + 외벽/내벽 (PM: "회사건물답게 흰색+벽") ──
const floor = new THREE.Mesh(
  new THREE.BoxGeometry(26, .5, 20),
  new THREE.MeshStandardMaterial({ color: 0xe9e7e0, roughness: .95 }));
floor.position.y = -.25; floor.receiveShadow = true; scene.add(floor);
// 건물 기단(테두리)
const plinth = new THREE.Mesh(
  new THREE.BoxGeometry(27.2, .3, 21.2),
  new THREE.MeshStandardMaterial({ color: 0xcfcdc4 }));
plinth.position.y = -.45; plinth.receiveShadow = true; scene.add(plinth);

const wallMat = new THREE.MeshStandardMaterial({ color: 0xf7f6f2, roughness: .9 });
const trimMat = new THREE.MeshStandardMaterial({ color: 0xdedbd2 });
const WALL_H = 2.6, WALL_T = .3;
function wall(cx, cz, w, d, h = WALL_H) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
  m.position.set(cx, h/2, cz); m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  const cap = new THREE.Mesh(new THREE.BoxGeometry(w + .06, .12, d + .06), trimMat);
  cap.position.set(cx, h + .06, cz); scene.add(cap);   // 벽 상단 몰딩
}
// 외벽 4면 — 남쪽(정문) 가운데 3폭 개구부
wall(0, -10, 26 + WALL_T, WALL_T);                 // 북
wall(-13, 0, WALL_T, 20);                          // 서
wall(13, 0, WALL_T, 20);                           // 동
wall(-7.25, 10, 11.5, WALL_T);                     // 남-좌
wall(7.25, 10, 11.5, WALL_T);                      // 남-우 (가운데 3 = 정문)
// 내벽 (부서 파티션, 문 틈 포함, 낮은 벽 h=2)
wall(-3, -8.5, WALL_T, 3, 2);                      // hq|dev 앞쪽
wall(-3, -2.75, WALL_T, 4.5, 2);                   // hq|dev 뒤쪽 (틈 = 문)
wall(-11.25, -.5, 3.5, WALL_T, 2);                 // 앞|뒤 구역 가로벽 (3분절)
wall(-3.5, -.5, 6, WALL_T, 2);
wall(5, -.5, 3, WALL_T, 2);
wall(-3, 2, WALL_T, 3, 2);                         // qa|research 앞쪽
wall(-3, 8.25, WALL_T, 3.5, 2);                    // qa|research 뒤쪽
wall(8.5, -5.5, WALL_T, 9, 2);                     // ops 복도벽 (가운데 문)
wall(8.5, 5.5, WALL_T, 9, 2);

const DEPTS = [
  { slug:"hq",       name:"👑 경영지원", jsonName:"경영지원", color:0xffd166, x:-8,  z:-5, w:8, d:8 },
  { slug:"dev",      name:"💻 개발부",   jsonName:"개발부",   color:0x7cc4ff, x: 2,  z:-5, w:8, d:8 },
  { slug:"qa",       name:"✅ 품질부",   jsonName:"품질부",   color:0x6ee7a0, x:-8,  z: 4, w:8, d:7 },
  { slug:"research", name:"📚 리서치부", jsonName:"리서치부", color:0xc4a2ff, x: 2,  z: 4, w:8, d:7 },
  { slug:"ops",      name:"📮 총무부",   jsonName:"총무부",   color:0xff8fa3, x:10.5,z: 0, w:4, d:16 },
];
// 신설 부서용 여유 자리 (정문 앞 홀 양옆 — 가운데는 회의실) — 소진되면 3D 표시 생략(현황판엔 존재)
const SPARE_SLOTS = [
  { x:-9, z:8.7, w:6, d:2.2 }, { x:6, z:8.7, w:4.5, d:2.2 },
];
function makeLabel(text, scale=1) {
  const cv = document.createElement("canvas"); cv.width = 512; cv.height = 128;
  const g = cv.getContext("2d");
  g.font = "bold 56px Pretendard, sans-serif"; g.textAlign = "center";
  g.fillStyle = "#fff"; g.strokeStyle = "rgba(0,0,0,.7)"; g.lineWidth = 8;
  g.strokeText(text, 256, 78); g.fillText(text, 256, 78);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(cv), transparent: true, depthWrite: false }));
  sp.scale.set(4*scale, 1*scale, 1);
  return sp;
}
/* ── 봇 머리 위 HP바 (구독 한도 잔량) ──────────────────────────
   /api/health 가 실측을 주는 봇(클또리·챗또리)만 게이지를 그린다.
   측정 불가한 봇(젬또리)은 '?'로 두고 가짜 게이지를 만들지 않는다. */
function makeHpBar() {
  const cv = document.createElement("canvas"); cv.width = 256; cv.height = 64;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(cv), transparent: true, depthWrite: false }));
  sp.scale.set(2.0, 0.5, 1);
  sp.userData.cv = cv;
  sp.visible = false;
  return sp;
}

const HP_COL = { good: "#6ee7a0", warn: "#ffd166", danger: "#ff6b6b" };

function drawHpBar(sp, hp) {
  const cv = sp.userData.cv, g = cv.getContext("2d");
  g.clearRect(0, 0, cv.width, cv.height);

  // 측정 불가 → 물음표만 (가짜 게이지 금지)
  if (!hp || !hp.measurable || !hp.windows?.length) {
    g.font = "bold 30px Pretendard, sans-serif"; g.textAlign = "center";
    g.fillStyle = "rgba(170,177,212,.85)";
    g.strokeStyle = "rgba(0,0,0,.7)"; g.lineWidth = 5;
    g.strokeText("한도 ?", 128, 40); g.fillText("한도 ?", 128, 40);
    sp.visible = true;
    sp.material.map.needsUpdate = true;
    return;
  }

  const w = hp.windows[0];                    // 가장 짧은 창(가장 급한 것)
  const pct = Math.max(0, Math.min(100, w.remaining_pct));
  const col = HP_COL[w.level] || "#6ee7a0";

  const BX = 16, BY = 22, BW = 224, BH = 18;
  g.fillStyle = "rgba(0,0,0,.55)";            // 테두리/배경
  g.fillRect(BX - 3, BY - 3, BW + 6, BH + 6);
  g.fillStyle = "rgba(255,255,255,.12)";
  g.fillRect(BX, BY, BW, BH);
  g.fillStyle = col;                          // 체력
  g.fillRect(BX, BY, BW * pct / 100, BH);

  g.font = "bold 20px Pretendard, sans-serif"; g.textAlign = "center";
  g.fillStyle = "#fff"; g.strokeStyle = "rgba(0,0,0,.8)"; g.lineWidth = 4;
  const txt = `${pct}%  ${w.label}`;
  g.strokeText(txt, 128, 16); g.fillText(txt, 128, 16);

  sp.visible = true;
  sp.material.map.needsUpdate = true;
}

function buildDeptVisual(dp) {
  dp.zoneMesh = new THREE.Mesh(
    new THREE.BoxGeometry(dp.w-.8, .06, dp.d-.8),
    new THREE.MeshStandardMaterial({ color: dp.color, transparent: true, opacity: .28 }));  // 흰 바닥 위 부서 카펫
  dp.zoneMesh.position.set(dp.x, .04, dp.z); scene.add(dp.zoneMesh);
  dp.lbl = makeLabel(dp.name, 1.1);
  dp.lbl.position.set(dp.x, 3.4, dp.z); scene.add(dp.lbl);
}
for (const dp of DEPTS) buildDeptVisual(dp);

// 현황판 부서 개편 동기화 — 신설(로비 자리)/명칭 변경/폐지
function syncDepts(list) {
  if (!Array.isArray(list) || !list.length) return;
  for (const d of list) {
    const col = parseInt((d.color || "#7cc4ff").replace("#", ""), 16);
    let dp = DEPTS.find(x => x.slug === d.slug);
    if (!dp) {
      const slot = SPARE_SLOTS.shift();
      if (!slot) continue;
      dp = { slug: d.slug, name: d.name, jsonName: d.name, color: col, spare: true, ...slot };
      DEPTS.push(dp);
      buildDeptVisual(dp);
    } else if (dp.jsonName !== d.name) {   // 간판 교체
      dp.jsonName = d.name;
      scene.remove(dp.lbl);
      dp.lbl = makeLabel(d.name, 1.1);
      dp.lbl.position.set(dp.x, 3.4, dp.z); scene.add(dp.lbl);
    }
  }
  for (const dp of [...DEPTS]) {          // 폐지: 카펫·간판 제거 (벽은 유지)
    if (!list.some(d => d.slug === dp.slug)) {
      scene.remove(dp.zoneMesh); scene.remove(dp.lbl);
      DEPTS.splice(DEPTS.indexOf(dp), 1);
    }
  }
}

// ── 책상 ─────────────────────────────────────────────────
const deskMat = new THREE.MeshStandardMaterial({ color: 0x5a4a3a });
const screenOn = new THREE.MeshStandardMaterial({ color: 0x9fdcff, emissive: 0x4488ff, emissiveIntensity: .9 });
const screenOff = new THREE.MeshStandardMaterial({ color: 0x222833 });
const desks = [];
function addDesk(x, z, rotY=0) {
  const grp = new THREE.Group();
  const top = new THREE.Mesh(new THREE.BoxGeometry(1.6, .12, .8), deskMat);
  top.position.y = .8; top.castShadow = true; grp.add(top);
  for (const [lx, lz] of [[-.7,-.3],[.7,-.3],[-.7,.3],[.7,.3]]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(.1, .8, .1), deskMat);
    leg.position.set(lx, .4, lz); grp.add(leg);
  }
  const scr = new THREE.Mesh(new THREE.BoxGeometry(.7, .45, .06), screenOff);
  scr.position.set(0, 1.15, -.25); grp.add(scr);
  grp.position.set(x, 0, z); grp.rotation.y = rotY; scene.add(grp);
  const seat = new THREE.Vector3(x, 0, z).add(
    new THREE.Vector3(0, 0, .85).applyEuler(new THREE.Euler(0, rotY, 0)));
  desks.push({ grp, scr, seat, rotY, taken: null });
  return desks.length - 1;
}
addDesk(-9, -6); addDesk(-6.5, -4.5, .4);          // hq
addDesk(1, -6); addDesk(4, -6); addDesk(2.5, -3.5, Math.PI); // dev
addDesk(-9, 4); addDesk(-6.5, 6, -.5);             // qa
addDesk(1.5, 5); addDesk(4.5, 4.2, .8);            // research
addDesk(10.5, -4, Math.PI/2); addDesk(10.5, 3, Math.PI/2);   // ops

// ── 회의실 (로비 중앙 원탁 — Debate 뷰) ─────────────────
const MEET = { x: 0, z: 8.0 };
const tableMat = new THREE.MeshStandardMaterial({ color: 0x8a6f52 });
const mtop = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, .1, 24), tableMat);
mtop.position.set(MEET.x, .85, MEET.z); mtop.castShadow = true; scene.add(mtop);
const mleg = new THREE.Mesh(new THREE.CylinderGeometry(.12, .2, .85, 12), tableMat);
mleg.position.set(MEET.x, .42, MEET.z); scene.add(mleg);
const meetSeats = [];
for (let i = 0; i < 6; i++) {
  const a = i / 6 * Math.PI * 2;
  meetSeats.push({ pos: new THREE.Vector3(MEET.x + Math.sin(a)*2.0, 0, MEET.z + Math.cos(a)*2.0), taken: null });
}
const meetLbl = makeLabel("🏛️ 회의실", .9);
meetLbl.position.set(MEET.x, 2.6, MEET.z); scene.add(meetLbl);

// ── 블록 캐릭터 (심즈-lite) ───────────────────────────────
const BOTS = [
  { name:"클또리",   dept:"hq",       color:0xffd166, state:"working" },
  { name:"코더봇A",  dept:"dev",      color:0x7cc4ff, state:"working" },
  { name:"코더봇B",  dept:"dev",      color:0x7cc4ff, state:"idle" },
  { name:"챗또리",   dept:"qa",       color:0x6ee7a0, state:"idle" },
  { name:"테스터봇", dept:"qa",       color:0x6ee7a0, state:"idle" },
  { name:"젬또리",   dept:"research", color:0xc4a2ff, state:"idle" },
  { name:"리서처봇", dept:"research", color:0xc4a2ff, state:"idle" },
  { name:"watcher",  dept:"ops",      color:0xff8fa3, state:"working" },
];
const bots = [];
function makeBot(cfg) {
  const dp = DEPTS.find(d => d.slug === cfg.dept);
  const grp = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: cfg.color });
  const skin = new THREE.MeshStandardMaterial({ color: 0xffe0c2 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(.55, .7, .35), bodyMat);
  body.position.y = .75; body.castShadow = true; grp.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(.28, 12, 12), skin);
  head.position.y = 1.35; head.castShadow = true; grp.add(head);
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
  for (const s of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(.045, 6, 6), eyeMat);
    eye.position.set(.11*s, 1.4, .24); grp.add(eye);
  }
  const legs = [];
  for (const s of [-1, 1]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(.16, .4, .16), bodyMat);
    leg.position.set(.15*s, .2, 0); grp.add(leg); legs.push(leg);
  }
  const arms = [];
  for (const s of [-1, 1]) {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(.13, .5, .13), bodyMat);
    arm.position.set(.36*s, .8, 0); grp.add(arm); arms.push(arm);
  }
  const lbl = makeLabel(cfg.name, .55); lbl.position.y = 2.0; grp.add(lbl);
  const zz = makeLabel("💤", .4); zz.position.set(.4, 1.9, 0); zz.visible = false; grp.add(zz);
  // 체력바 — 실제 CLI 봇(클또리·챗또리·젬또리)에게만 붙는다. 가상 부서봇은 한도 개념이 없다.
  const hpbar = makeHpBar(); hpbar.position.y = 2.42; grp.add(hpbar);
  grp.position.set(dp.x + (Math.random()-.5)*3, 0, dp.z + (Math.random()-.5)*3);
  scene.add(grp);
  const bot = { ...cfg, grp, legs, arms, zz, hpbar, dp, bodyMat,
    target: null, phase: Math.random()*10, deskIdx: null, sitT: 0 };
  assignBehavior(bot);
  return bot;
}
function removeBot(b) {
  if (b.deskIdx !== null) { desks[b.deskIdx].taken = null; desks[b.deskIdx].scr.material = screenOff; }
  const ms = meetSeats.find(s => s.taken === b.name);
  if (ms) ms.taken = null;
  scene.remove(b.grp);
  bots.splice(bots.indexOf(b), 1);
}
// 현황판(projects.json)과 봇 명단 동기화 — 추가/삭제/부서이동 실시간 반영
function syncRoster(list) {
  const names = new Set(list.map(x => x.name));
  for (const b of [...bots]) if (!names.has(b.name)) removeBot(b);
  for (const x of list) {
    const dp = DEPTS.find(d => d.slug === x.dept) || DEPTS[0];
    let b = bots.find(b => b.name === x.name);
    if (!b) {
      bots.push(makeBot({ name: x.name, dept: dp.slug, color: dp.color, state: "idle" }));
    } else if (b.dept !== dp.slug) {   // 부서 이동: 색 갈아입고 새 부서로 이사
      b.dept = dp.slug; b.dp = dp;
      b.bodyMat.color.setHex(dp.color);
      b.state = "idle"; b.sitT = 0;
      assignBehavior(b);
    }
  }
}
function deptDesks(slug) {
  const dp = DEPTS.find(d => d.slug === slug);
  return desks.map((d, i) => ({ d, i })).filter(({d}) =>
    Math.abs(d.grp.position.x - dp.x) <= dp.w/2 && Math.abs(d.grp.position.z - dp.z) <= dp.d/2);
}
function assignBehavior(bot) {
  if (bot.deskIdx !== null) { desks[bot.deskIdx].taken = null; desks[bot.deskIdx].scr.material = screenOff; bot.deskIdx = null; }
  // 회의 중이 아닌데 회의석을 물고 있으면 반납 (bot.done 등으로 회의 이탈 시)
  const ms = meetSeats.find(s => s.taken === bot.name);
  if (ms && bot.state !== "meeting") ms.taken = null;
  if (bot.state === "working") {
    const free = deptDesks(bot.dept).filter(({d}) => !d.taken);
    if (free.length) {
      const { d, i } = free[Math.floor(Math.random()*free.length)];
      d.taken = bot.name; bot.deskIdx = i; bot.target = d.seat.clone();
      return;
    }
  }
  // idle: 부서 구역 내 랜덤 산책
  bot.target = new THREE.Vector3(
    bot.dp.x + (Math.random()-.5)*(bot.dp.w-1.5), 0,
    bot.dp.z + (Math.random()-.5)*(bot.dp.d-1.5));
}
for (const cfg of BOTS) bots.push(makeBot(cfg));

// ── 애니메이션 루프 ──────────────────────────────────────
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;
  for (const b of bots) {
    b.zz.visible = b.state === "idle";
    const pos = b.grp.position;
    if (b.target) {
      const dir = b.target.clone().sub(pos); dir.y = 0;
      const dist = dir.length();
      if (dist > .12) {
        dir.normalize();
        pos.addScaledVector(dir, dt * (b.state === "working" ? 2.2 : 1.1));
        b.grp.rotation.y = Math.atan2(dir.x, dir.z);
        // 걷기: 다리/팔 스윙 + 통통 바운스
        const sw = Math.sin(t*9 + b.phase) * .5;
        b.legs[0].rotation.x = sw; b.legs[1].rotation.x = -sw;
        b.arms[0].rotation.x = -sw*.7; b.arms[1].rotation.x = sw*.7;
        pos.y = Math.abs(Math.sin(t*9 + b.phase)) * .06;
      } else {
        pos.y = 0;
        b.legs.forEach(l => l.rotation.x = 0);
        if (b.deskIdx !== null) {
          // 책상 도착: 화면 켜고 타이핑 까딱까딱
          const dsk = desks[b.deskIdx];
          dsk.scr.material = screenOn;
          b.grp.rotation.y = dsk.rotY + Math.PI;
          b.arms[0].rotation.x = -1 + Math.sin(t*13)*.25;
          b.arms[1].rotation.x = -1 + Math.cos(t*11)*.25;
          b.sitT += dt;
          if (b.sitT > 14 + Math.random()*8) { b.sitT = 0; assignBehavior(b); } // 기지개 겸 자리 이동
        } else if (b.state === "meeting") {
          // 회의: 원탁을 바라보고 토론 손짓
          b.grp.rotation.y = Math.atan2(MEET.x - pos.x, MEET.z - pos.z);
          b.arms.forEach((a, i) => a.rotation.x = -.5 + Math.sin(t*3 + b.phase + i*1.7)*.25);
        } else {
          b.arms.forEach(a => a.rotation.x = Math.sin(t*2 + b.phase)*.08);
          if (Math.random() < dt*.25) assignBehavior(b);   // 어슬렁 다음 목적지
        }
      }
    }
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ── Debate 뷰: debate.* 이벤트 → 회의실 소집/말풍선/해산 ──
const debate = { active: false, id: null };
function debateJoin(name) {
  const b = bots.find(b => b.name === name);
  if (!b || b.state === "meeting") return;
  const seat = meetSeats.find(s => !s.taken);
  if (!seat) return;
  seat.taken = name;
  if (b.deskIdx !== null) { desks[b.deskIdx].taken = null; desks[b.deskIdx].scr.material = screenOff; b.deskIdx = null; }
  b.state = "meeting"; b.target = seat.pos.clone();
}
function debateEnd() {
  debate.active = false; debate.id = null;
  document.getElementById("debatebox").style.display = "none";
  for (const s of meetSeats) {
    const b = s.taken && bots.find(b => b.name === s.taken);
    s.taken = null;
    if (b) { b.state = "idle"; b.sitT = 0; assignBehavior(b); }
  }
}
function bubble(b, text) {
  if (b.bub) b.grp.remove(b.bub);
  b.bub = makeLabel("💬 " + text.slice(0, 14), .7);
  b.bub.position.y = 2.5; b.grp.add(b.bub);
  clearTimeout(b.bubT);
  b.bubT = setTimeout(() => { if (b.bub) { b.grp.remove(b.bub); b.bub = null; } }, 7000);
}
function debateLogLine(text) {
  const log = document.getElementById("debate-log");
  const li = document.createElement("li"); li.textContent = text;
  log.prepend(li);
  while (log.children.length > 5) log.lastChild.remove();
}
function applyDebate(ev, animate) {
  if (ev.type === "debate.started") {
    if (debate.active) debateEnd();   // 이전 회의 미정리 좌석 누수 방지 (챗또리 리뷰)
    debate.active = true; debate.id = ev.task_id || null;
    document.getElementById("debate-topic").textContent = "주제: " + ev.summary;
    document.getElementById("debate-log").innerHTML = "";
    document.getElementById("debatebox").style.display = "block";
    debateJoin(ev.actor);
    for (const name of (ev.refs || [])) debateJoin(name);   // refs = 참여 봇 이름 목록
    return;
  }
  if (!debate.active) return;
  if (debate.id && ev.task_id && ev.task_id !== debate.id) return;   // 다른 회의 이벤트 혼입 차단
  if (ev.type === "debate.statement") {
    debateJoin(ev.actor);   // 늦게 합류해도 착석
    const b = bots.find(b => b.name === ev.actor);
    if (b && animate) bubble(b, ev.summary);
    debateLogLine(`${ev.actor}: ${ev.summary}`);
  } else if (ev.type === "debate.concluded") {
    debateLogLine(`🤝 결론: ${ev.summary}`);
    if (!animate) return debateEnd();   // 리플레이(과거 회의)는 즉시 해산
    const endId = debate.id;            // 8초 내 새 회의 시작 시 오발 종료 방지
    setTimeout(() => { if (debate.active && debate.id === endId) debateEnd(); }, 8000);
  }
}

function applyEvent(ev, animate) {
  // 피드만 프로젝트 필터를 탄다 — 봇 애니메이션/상태는 회사 전경이라 항상 반영
  if (animate && CC.matchesProject(ev, CC.getProjFilter()))
    addFeed(`${TYPE_ICON[ev.type] || "•"} ${ev.actor}`, ev.summary);
  if (ev.type.startsWith("debate.")) return applyDebate(ev, animate);
  const b = bots.find(b => b.name === ev.actor);   // 명단은 projects.json과 동기화됨
  if (!b) return;
  if (ev.type === "bot.spawned" || ev.type === "task.assigned") { b.state = "working"; b.sitT = 0; assignBehavior(b); }
  if (ev.type === "bot.done" || ev.type === "bot.failed") { b.state = "idle"; b.sitT = 0; assignBehavior(b); }
  if (ev.type === "mail.in" || ev.type === "mail.out") {
    const w = bots.find(b => b.name === "watcher");
    if (w && animate) { w.state = "working"; assignBehavior(w); }
  }
}

  const ft = d.tasks.filter(t => CC.matchesProject(t, CC.getProjFilter()));

    `미완료 ${ft.filter(t => t.is_open).length}${
      ft.filter(t => t.stuck).length ? ` · ⚠️ ${ft.filter(t => t.stuck).length}` : ""}`;

  // 미완료 우선 → 정체 우선 → 최근순.
  // is_open 은 서버(tasks.py) 판정 — 종료 상태 목록을 JS에 복제하지 않는다(SSOT).
  const list = [...ft].sort((a, b) =>
    (b.is_open - a.is_open) ||
    (b.stuck - a.stuck) ||
    String(b.updated_at).localeCompare(String(a.updated_at))
  ).slice(0, 8);

  document.getElementById("tasks").innerHTML = list.map(t => `
    <li class="${t.stuck ? "stuck" : ""}">
      <span class="tid">${esc(t.task_id)}</span>
      <span class="tt">
        <span style="color:${t.state_color}">${t.state_icon} ${esc(t.state_label)}</span>

}

async function pollEvents() {
  try {
    const [r, rp] = await Promise.all([
      fetch("/company/events.jsonl", { cache: "no-store" }),
      fetch("/company/projects.json", { cache: "no-store" }),
    ]);
    // projects.json = 서버 생존 신호. events.jsonl은 신규 환경에 아직 없을 수 있다(런타임 로그, git 미추적)
    if (!rp.ok) throw 0;
    try {
      const pj = await rp.json();
      syncDepts(pj.depts || []);
      syncRoster(pj.bots || []);
      syncProjSel(pj.projects || []);
    } catch { /* 명단 파싱 실패 무시 */ }
    const evs = r.ok
      ? (await r.text()).trim().split("\n").filter(Boolean).map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean)
      : [];
    EVS = evs;
    if (!live) {  // LIVE 전환: 데모 중단, 전체 로그로 상태 복원 + 최근 30건만 피드 렌더
      live = true; clearInterval(demoTimer);
      document.getElementById("mode").textContent = evs.length ? "3D — 🔴 LIVE" : "3D — 🟢 LIVE — 이벤트 없음";
      for (const ev of evs) applyEvent(ev, false);   // 30건 밖 봇 상태·진행 중 회의도 복원 (챗또리 리뷰)
      rebuildFeed();                                 // 피드는 프로젝트 필터 기준으로 구성
      seenCount = evs.length;
      renderApprovals();
      return;
    }
    const hadNew = evs.length > seenCount;
    for (const ev of evs.slice(seenCount)) applyEvent(ev, true);
    seenCount = evs.length;
    if (hadNew) renderApprovals();
  } catch { /* 서빙 안 됨 — DEMO 유지 */ }
}
setInterval(pollEvents, 3000); pollEvents();

];
