<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI agent — 문서</title>
  <script src="https://unpkg.com/marked/lib/marked.umd.js"></script>
  <style>
    :root {
      --bg: #0f1220;
      --panel: #181c30;
      --panel2: #1f2440;
      --line: #2c3358;
      --ink: #e8eaf6;
      --ink2: #aab1d4;
      --muted: #7a81a6;
      --accent: #ffd166;
      --good: #6ee7a0;
      --info: #7cc4ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Pretendard", sans-serif;
      padding: 18px;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    a { color: var(--info); text-decoration: none; }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
      flex-shrink: 0;
    }
    header h1 { font-size: 19px; }
    header .sub { font-size: 12px; color: var(--muted); }

    .layout {
      display: flex;
      gap: 16px;
      flex: 1;
      min-height: 0;
    }

    #sidebar {
      width: 300px;
      flex-shrink: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      overflow-y: auto;
    }

    #sidebar input {
      width: 100%;
      background: var(--panel2);
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 6px;
      padding: 7px 9px;
      font-size: 12px;
      margin-bottom: 10px;
      font-family: inherit;
    }

    .folder-h {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
      margin: 10px 0 4px;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
    }
    .folder-h:hover { color: var(--ink2); }
    .folder-h:first-child { margin-top: 0; }

    .subfolder-h {
      font-size: 11px;
      color: var(--ink2);
      margin: 6px 0 2px 8px;
      cursor: pointer;
      user-select: none;
    }
    .subfolder-h:hover { color: var(--ink); }
    .subgroup .file-item { padding-left: 22px; }

    .file-item {
      display: block;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12.5px;
      color: var(--ink2);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-item:hover { background: var(--panel2); }
    .file-item.active { background: var(--panel2); color: var(--accent); font-weight: 600; }

    .empty { color: var(--muted); font-size: 12px; padding: 6px 8px; }

    #content {
      flex: 1;
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 24px 32px;
      overflow-y: auto;
    }

    #meta {
      font-size: 11px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
      margin-bottom: 16px;
      display: none;
    }
    #meta span { margin-right: 12px; }

    #doc-body h1, #doc-body h2, #doc-body h3 { color: var(--ink); margin: 18px 0 8px; line-height: 1.4; }
    #doc-body h1 { font-size: 22px; }
    #doc-body h2 { font-size: 18px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
    #doc-body h3 { font-size: 15px; color: var(--info); }
    #doc-body p { line-height: 1.7; margin: 8px 0; color: var(--ink2); font-size: 13.5px; }
    #doc-body ul, #doc-body ol { margin: 8px 0 8px 22px; color: var(--ink2); font-size: 13.5px; line-height: 1.7; }
    #doc-body li { margin: 3px 0; }
    #doc-body code {
      background: var(--panel2); padding: 1px 5px; border-radius: 4px;
      font-size: 12px; color: var(--accent);
    }
    #doc-body pre {
      background: var(--panel2); padding: 12px 14px; border-radius: 8px;
      overflow-x: auto; margin: 10px 0; border: 1px solid var(--line);
    }
    #doc-body pre code { background: none; padding: 0; color: var(--ink2); }
    #doc-body blockquote {
      border-left: 3px solid var(--line); padding: 2px 14px; margin: 10px 0;
      color: var(--muted); font-size: 13px;
    }
    #doc-body table { border-collapse: collapse; margin: 10px 0; font-size: 12.5px; }
    #doc-body th, #doc-body td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
    #doc-body th { background: var(--panel2); color: var(--ink2); }
    #doc-body hr { border: none; border-top: 1px solid var(--line); margin: 18px 0; }
    #doc-body a.wikilink { color: var(--good); border-bottom: 1px dashed var(--good); cursor: pointer; }
    #doc-body a.wikilink.broken { color: var(--muted); border-bottom: 1px dashed var(--muted); cursor: default; }
    #doc-body img { max-width: 100%; border-radius: 6px; }

    .placeholder { color: var(--muted); font-size: 13px; padding: 40px; text-align: center; }
  </style>
</head>

<body>
  <header>
    <h1>📄 AI agent — 문서 <a href="board.html" style="font-size:12px; margin-left:10px">📊 현황판 →</a>
      <a href="dashboard3d.html" style="font-size:12px; margin-left:10px">🎮 3D 사무실 →</a></h1>
    <div class="sub">daily · specs · projects (옵시디언 vault 마크다운, 읽기 전용)</div>
  </header>

  <div class="layout">
    <div id="sidebar">
      <input id="search" placeholder="파일 검색...">
      <div id="filelist"><div class="empty">로딩…</div></div>
    </div>
    <div id="content">
      <div id="meta"></div>
      <div id="doc-body"><div class="placeholder">왼쪽에서 문서를 선택하세요</div></div>
    </div>
  </div>

<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // 실제 vault 폴더는 안 건드리고(기존 [[wikilink]] 보존), 화면에서만 업무 단위로 묶어 보여준다.
  // projects/<key>/... 의 <key>를 업무(그룹)·컴포넌트(서브그룹)로 매핑 — 여기 없는 폴더는
  // "미분류 문서"로 폴백(조용히 안 숨김).
  const PROJECT_GROUPS = {
    "close": { group: "팬버드", sub: "🌐 웹대시보드" },
    "fanbird-broadcast": { group: "팬버드", sub: "📱 송출앱" },
    "FMS": { group: "FMS", sub: null },
  };

  let FILES = [];       // [{path, folder, name, mtime}]
  let currentPath = null;

  async function loadFileList() {
    try {
      const r = await fetch("/api/docs", { cache: "no-store" });
      const j = await r.json();
      FILES = j.ok ? j.files : [];
    } catch { FILES = []; }
    renderFileList();
  }

  const fileItemHtml = f => `<div class="file-item${f.path === currentPath ? " active" : ""}"
    data-path="${esc(f.path)}" title="${esc(f.path)}">${esc(f.path.split("/").pop())}</div>`;

  // 문서가 많아지면 한눈에 안 들어와서, 그룹 헤더 클릭으로 접고 펼 수 있게 한다.
  // 접힘 상태는 key(그룹 식별자) 기준으로 기억해뒀다가 재검색/재렌더 때도 유지한다.
  const collapsedGroups = new Set();
  function groupHeader(key, label, cls = "folder-h") {
    const collapsed = collapsedGroups.has(key);
    return `<div class="${cls}" data-toggle="${esc(key)}">${collapsed ? "▸" : "▾"} ${esc(label)}</div>`;
  }
  function groupBody(key, innerHtml, wrapClass = "") {
    const collapsed = collapsedGroups.has(key);
    return `<div class="${wrapClass}"${collapsed ? ' style="display:none"' : ""}>${innerHtml}</div>`;
  }

  // "260714" 같은 YYMMDD 파일명만 월별로 묶는다 — Daily.md 같은 인덱스 파일은 월이 없어 별도 취급.
  const monthKeyOf = f => {
    const m = f.name.match(/^(\d{2})(\d{2})(\d{2})$/);
    return m ? `20${m[1]}-${m[2]}` : null;
  };
  const MONTH_LABEL = k => { const [y, m] = k.split("-"); return `${y}년 ${Number(m)}월`; };

  function renderFileList(filter = "") {
    const q = filter.trim().toLowerCase();
    const dailyList = [];
    const projGroups = {};   // { "팬버드": { "🌐 웹대시보드": [...], "📱 송출앱": [...] }, "FMS": { "_": [...] } }
    for (const f of FILES) {
      if (q && !f.path.toLowerCase().includes(q)) continue;
      if (f.folder === "daily") { dailyList.push(f); continue; }
      const parts = f.path.split("/");           // "projects/close/close.md" → [projects, close, close.md]
      const projKey = parts.length > 2 ? parts[1] : null;
      const mapped = projKey && PROJECT_GROUPS[projKey];
      const groupName = mapped ? mapped.group : "미분류 문서";
      const subKey = mapped ? (mapped.sub || "_") : "_";
      (projGroups[groupName] ??= {});
      (projGroups[groupName][subKey] ??= []).push(f);
    }
    let html = "";
    if (dailyList.length) {
      html += groupHeader("daily", "🗓️ Daily");
      const monthBuckets = {};
      const noMonth = [];
      for (const f of dailyList) {
        const mk = monthKeyOf(f);
        (mk ? (monthBuckets[mk] ??= []) : noMonth).push(f);
      }
      let inner = noMonth.map(fileItemHtml).join("");
      for (const mk of Object.keys(monthBuckets).sort().reverse()) {
        const mkey = `daily:${mk}`;
        const items = monthBuckets[mk].sort((a, b) => b.name.localeCompare(a.name)).map(fileItemHtml).join("");
        inner += groupHeader(mkey, MONTH_LABEL(mk), "subfolder-h") + groupBody(mkey, items, "subgroup");
      }
      html += groupBody("daily", inner);
    }
    for (const groupName of Object.keys(projGroups)) {
      html += groupHeader(groupName, `📂 ${groupName}`);
      const subs = projGroups[groupName];
      let inner = "";
      for (const subKey of Object.keys(subs)) {
        const items = subs[subKey].map(fileItemHtml).join("");
        if (subKey === "_") { inner += items; continue; }
        const skey = `${groupName}:${subKey}`;
        inner += groupHeader(skey, subKey, "subfolder-h") + groupBody(skey, items, "subgroup");
      }
      html += groupBody(groupName, inner);
    }
    $("filelist").innerHTML = html || `<div class="empty">일치하는 문서 없음</div>`;
  }

  $("search").addEventListener("input", e => renderFileList(e.target.value));

  $("filelist").addEventListener("click", ev => {
    const toggle = ev.target.closest("[data-toggle]");
    if (toggle) {
      const key = toggle.dataset.toggle;
      if (collapsedGroups.has(key)) collapsedGroups.delete(key); else collapsedGroups.add(key);
      renderFileList($("search").value);
      return;
    }
    const item = ev.target.closest("[data-path]");
    if (item) openDoc(item.dataset.path);
  });

  // 옵시디언 프론트매터(--- ... ---) 파싱 — 화면엔 안 보이는 메타(status/updated 등)만 살짝 보여준다.
  function parseFrontmatter(raw) {
    const m = raw.match(/^---\n([\s\S]*?)\n---\n?/);
    if (!m) return { body: raw, meta: {} };
    const meta = {};
    for (const line of m[1].split("\n")) {
      const kv = line.match(/^([A-Za-z_]+):\s*(.*)$/);
      if (kv) meta[kv[1]] = kv[2].replace(/^"|"$/g, "");
    }
    return { body: raw.slice(m[0].length), meta };
  }

  // 작업일지 하단 "## 📬 Inbox Archive" 섹션은 젬또리 원문 그대로 박제된 아카이브라
  // 화면에서 안 보이게 자른다(항상 일지의 마지막 섹션이라 그 지점부터 끝까지 제거).
  function stripInboxArchive(md) {
    const idx = md.search(/^##\s*📬\s*Inbox Archive/m);
    return idx === -1 ? md : md.slice(0, idx).trimEnd() + "\n";
  }

  // [[wikilink]] / [[wikilink|라벨]] — 파일 인덱스에서 경로/파일명으로 찾아 클릭 가능한 링크로 치환.
  // 못 찾으면 깨진 링크 표시(회색, 클릭 안 됨) — 있는 척 안 함.
  function resolveWikilinks(md) {
    return md.replace(/\[\[([^\]|#]+)(#[^\]|]*)?(?:\|([^\]]+))?\]\]/g, (whole, link, anchor, label) => {
      const target = link.trim();
      const disp = esc((label || target).trim());
      let hit = FILES.find(f => f.path === target || f.path === target + ".md");
      if (!hit) hit = FILES.find(f => f.name.toLowerCase() === target.toLowerCase());
      if (!hit) {
        const stem = target.split("/").pop();
        hit = FILES.find(f => f.name.toLowerCase() === stem.toLowerCase());
      }
      return hit
        ? `<a href="#" class="wikilink" data-path="${esc(hit.path)}">${disp}</a>`
        : `<span class="wikilink broken" title="문서를 못 찾음: ${esc(target)}">${disp}</span>`;
    });
  }

  async function openDoc(path) {
    currentPath = path;
    renderFileList($("search").value);
    $("doc-body").innerHTML = `<div class="placeholder">불러오는 중…</div>`;
    $("meta").style.display = "none";
    try {
      const r = await fetch("/" + path, { cache: "no-store" });
      if (!r.ok) throw new Error(String(r.status));
      const raw = await r.text();
      const { body: rawBody, meta } = parseFrontmatter(raw);
      const body = stripInboxArchive(rawBody);
      if (Object.keys(meta).length) {
        $("meta").style.display = "block";
        $("meta").innerHTML = Object.entries(meta)
          .filter(([k]) => ["status", "type", "project", "updated", "created", "author"].includes(k))
          .map(([k, v]) => `<span><b style="color:var(--ink2)">${esc(k)}</b>: ${esc(v)}</span>`).join("");
      }
      const withLinks = resolveWikilinks(body);
      $("doc-body").innerHTML = marked.parse(withLinks);
    } catch (e) {
      $("doc-body").innerHTML = `<div class="placeholder">문서를 불러오지 못했습니다 (${esc(String(e.message || e))})</div>`;
    }
  }

  $("doc-body").addEventListener("click", ev => {
    const link = ev.target.closest("a.wikilink[data-path]");
    if (link) { ev.preventDefault(); openDoc(link.dataset.path); }
  });

  loadFileList();
</script>
</body>
</html>
